# ====================================================================================
# CONFIGURAZIONE GLOBALE DELL'APPLICAZIONE: application.properties
# ====================================================================================
# Questo file contiene le proprieta' di configurazione centralizzate per Spring Boot.
# Definisce i parametri di connessione al database PostgreSQL (Strato di Persistenza)
# e le impostazioni del motore ORM Hibernate per la gestione automatica dello schema.
# ====================================================================================

# ====================================================================================
# 1. CONFIGURAZIONE DEL DATABASE (PostgreSQL Data Source)
# ====================================================================================

# URL di connessione JDBC. Specifica il protocollo (postgresql), l'host (localhost),
# la porta di ascolto di default (5432) e il nome del database di destinazione (postgres).
# ------------------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
# ------------------------------------------------------------------------------------

# Nome utente amministratore predefinito per l'accesso all'istanza PostgreSQL.
# ------------------------------------------------------------------------------------
spring.datasource.username=postgres
# ------------------------------------------------------------------------------------

# Password di accesso al database (allineata con la variabile d'ambiente impostata
# all'interno del file Docker Compose per lo sviluppo locale).
# NOTA TECNICA:
# In ambienti di produzione, la password non dovrebbe mai essere scritta in chiaro
# nel file di properties. Si utilizzano variabili d'ambiente (es. ${DB_PASSWORD})
# o secret manager esterni (Vault, AWS Secrets Manager) per iniettare il valore
# in modo sicuro. Qui viene mantenuta per semplicita' didattica.
spring.datasource.password=changemeinprod!
# ------------------------------------------------------------------------------------

# Nome completamente qualificato della classe del driver JDBC di PostgreSQL
# utilizzato da HikariCP per stabilire il pool di connessioni fisiche.
# NOTA TECNICA:
# Anche se in Spring Boot 3 non e' strettamente obbligatorio specificarlo (viene
# dedotto automaticamente dall'URL jdbc:postgresql), mantenerlo e' una buona pratica
# per chiarezza e per prevenire problemi in classloader particolari.
# ------------------------------------------------------------------------------------
spring.datasource.driver-class-name=org.postgresql.Driver

# ====================================================================================
# 2. CONFIGURAZIONE JPA & HIBERNATE (Object-Relational Mapping)
# ====================================================================================

# Regola la generazione automatica del linguaggio di definizione dei dati (DDL).
# Impostando il valore su "update", Hibernate esamina le classi annotate con @Entity
# all'avvio dell'applicazione e crea o modifica automaticamente le tabelle e le
# relazioni nel database per allinearle con il codice Java, senza toccare i dati esistenti.
# NOTA TECNICA:
# L'uso di 'update' e' comodo in fase di sviluppo, ma e' fortemente sconsigliato in
# produzione. In un ambiente reale, si utilizza:
#   - 'validate' per verificare che lo schema corrisponda alle entity (senza modifiche)
#   - Strumenti di migration come Flyway o Liquibase per gestire le modifiche
#     allo schema in modo controllato e versionato (evitando perdite di dati).
# Qui viene mantenuto 'update' per coerenza con il tutorial di riferimento.
# ------------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
# ------------------------------------------------------------------------------------

# E' un'ottima pratica definire il dialetto di Hibernate per PostgreSQL per evitare che tenti
# di indovinarlo a runtime, soprattutto per versioni specifiche come PostgreSQL 15 o 16.
# CONSIGLIO: Specifica esplicitamente il dialetto SQL da utilizzare:
# ------------------------------------------------------------------------------------
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# ------------------------------------------------------------------------------------