# ====================================================================================
# CONFIGURAZIONE DI TEST: application.properties (test resources)
# ====================================================================================
# Questo file contiene le proprieta' di configurazione specifiche per l'ambiente di TEST.
# Sostituisce e sovrascrive le impostazioni definite nel file di produzione principale
# (src/main/resources/application.properties) durante l'esecuzione della suite di test.
# Consente di eseguire test di integrazione rapidi ed isolati senza rischiare di alterare
# o inquinare i dati del database reale di produzione.
# NOTA: Le credenziali (sa/password) e la strategia di generazione dello schema
# sono specifiche per il database volatile H2 in-memory.
# Le best practice di sicurezza e gestione delle migration (es. variabili d'ambiente,
# Flyway) NON si applicano in questo contesto, poiche' il database viene creato
# e distrutto ad ogni esecuzione dei test, senza persistenza ne' esposizione di rete.
# ====================================================================================

# ====================================================================================
# 1. CONFIGURAZIONE DEL DATABASE DI TEST (H2 In-Memory)
# ====================================================================================

# URL di connessione JDBC per il database H2 in memoria (testdb).
# Configura H2 in modalita' di emulazione PostgreSQL attraverso parametri specifici:
# - "jdbc:h2:mem:testdb": Istanzia un database volatile interamente memorizzato in RAM.
# - "MODE=PostgreSQL": Dice a H2 di emulare le peculiarita' sintattiche e dialettali di PostgreSQL.
# - "DATABASE_TO_LOWER=TRUE": Converte i nomi degli oggetti in minuscolo, rispettando il comportamento di PostgreSQL (H2 usa di default il maiuscolo).
# - "DEFAULT_NULL_ORDERING=HIGH": Uniforma l'ordinamento dei record con valori nulli a quello standard di PostgreSQL.
# ------------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
# ------------------------------------------------------------------------------------

# Nome utente standard di System Administrator (sa) fornito per convenzione da H2.
# ------------------------------------------------------------------------------------
spring.datasource.username=sa
# ------------------------------------------------------------------------------------

# Password predefinita per l'autenticazione all'istanza volatile di test.
# ------------------------------------------------------------------------------------
spring.datasource.password=password
# ------------------------------------------------------------------------------------

# Classe del driver JDBC di H2 utilizzato da Spring Boot per gestire la connessione di test.
# NOTA TECNICA:
# In Spring Boot 3, la definizione esplicita di 'spring.datasource.driver-class-name' non e'
# strettamente obbligatoria, poiche' il framework e' in grado di dedurre automaticamente
# il driver corretto dall'URL JDBC (jdbc:h2:... -> org.h2.Driver).
# Tuttavia, mantenerlo nel file di test e' considerata una buona pratica di chiarezza
# e robustezza, poiche' esplicita esplicitamente l'intento e previene eventuali
# comportamenti anomali in contesti di classloader particolari.
# ------------------------------------------------------------------------------------
spring.datasource.driver-class-name=org.h2.Driver
# ------------------------------------------------------------------------------------

# IMPORTANTE (Bug preventivo): In Spring Boot 3, quando si usa H2 in modalita' emulazione
# PostgreSQL, Hibernate si confonde spesso a runtime e prova ad applicare il dialetto nativo
# di H2 anziche' quello di PostgreSQL, causando il fallimento dei test di integrazione relazionali
# (specialmente sulle sequenze e sui vincoli).Per blindare i test, e' fortemente raccomandato
# forzare il dialetto PostgreSQL anche per H2 e disattivare lo storage persistente di H2
# impostando defer-datasource-initialization=true.
# CONSIGLIO: Forza Hibernate a generare query compatibili con PostgreSQL anche se la connessione fisica e' H2.
# Senza questa proprieta', Hibernate applicherebbe le regole di H2, facendo fallire i test sulle sequenze.
# ------------------------------------------------------------------------------------
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ------------------------------------------------------------------------------------

# ====================================================================================
# CONFIGURAZIONE STRATO JPA PER L'AMBIENTE DI TEST
# ====================================================================================

# Forza la rigenerazione automatica delle tabelle e delle SEQUENZE ad ogni riavvio del contesto
spring.jpa.hibernate.ddl-auto=update

# Usa il dialetto H2 nativo: permette ad Hibernate di creare correttamente le sequenze
# compatibili con H2 in RAM, lasciando che H2 si occupi dell'emulazione PostgreSQL esterna
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Mostra i log SQL nel terminale durante i test (Opzionale, utilissimo per fare debug)
spring.jpa.show-sql=true
